<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src ipc: http://ipc.localhost">
<title>Rift Coach HUD</title>
<link rel="stylesheet" href="hud-style.css">
<style>
  /* One window over the whole game client area; each panel is a box placed by all-bridge.ts.
     transform makes position:fixed children (the minimap canvas) relative to their panel. */
  html, body { pointer-events: none; }
  .panel { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; transform: translateZ(0); visibility: hidden; }
</style>
</head>
<body>
<div class="panel" id="p-minimap"><canvas id="c" class="full"></canvas></div>
<div class="panel" id="p-topbar"><div class="top"><div id="bar" class="bar hidden"><span class="call" id="call"></span><span class="tag" id="tag"></span></div><div id="alert" class="alert hidden"><span class="dot"></span><span class="txt" id="alertTxt"></span><span class="conf" id="alertConf"></span></div><div id="obj" class="alert obj hidden"><span class="verdict" id="objVerdict"></span><span class="txt" id="objTxt"></span></div></div></div>
<div class="panel" id="p-death"><div class="wrap fade" id="root"><div class="card death"><div class="head"><span id="title"></span><span class="right" id="respawn"></span></div><ul id="points"></ul></div></div></div>
<div class="panel" id="p-loading"><div class="wrap fade" id="root"><div class="card loading"><div class="head"><span>Przeciwnicy</span><span class="right" id="note"></span></div><div class="rows" id="rows"></div></div></div></div>
<div class="panel" id="p-power"><div class="wrap fade" id="root"><div class="card power"><div class="dg hidden" id="danger"><div class="dg-top"><span class="dg-label" id="dgLabel"></span><span class="dg-meter" id="dgMeter"><i></i><i></i><i></i><i></i></span></div><div class="dg-why" id="dgWhy"></div></div><div id="pw"><div class="pw-row"><img id="meIcon" class="pw-icon" alt=""><span class="pw-near" id="meNear"></span><span class="pw-me">Ty</span><div class="pw-bar"><div class="pw-fill" id="fill"><span id="pct"></span></div></div><span class="pw-near" id="enNear"></span><img id="enIcon" class="pw-icon" alt=""></div><div class="pw-advice" id="advice"></div></div></div><div class="card lead hidden" id="detail"></div></div></div>
<div class="panel" id="p-build"><div class="wrap bottom fade" id="root"><div class="card build"><div class="bd-phase" id="phase"></div><div class="bd-rows" id="rows"></div></div></div></div>
<div class="panel" id="p-notify"><div class="notify"><div id="chips" class="chips"></div><div id="toasts" class="toasts"></div></div></div>
<script src="hud-all.js"></script>
</body>
</html>
