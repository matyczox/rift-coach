[package]
name = "rc-vision"
description = "Rift Coach: minimap vision (portrait detector, fog mask, camps, health bars), screen capture and fog tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

# windows 0.58 links through windows-targets 0.52 import libraries, so it builds on the GNU
# toolchain without dlltool/binutils (windows >= 0.59 uses raw-dylib and needs dlltool + as).
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
optional = true
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
]

[features]
default = ["capture"]
capture = ["dep:windows"]

[dev-dependencies]
flate2 = "1"
