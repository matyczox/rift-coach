[workspace]
resolver = "2"
members = ["app", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
# 16 = parallel codegen: ~2x faster builds; with thin LTO runtime speed is practically the same.
codegen-units = 16
strip = true

# Vision code is hot even in dev builds.
[profile.dev.package."*"]
opt-level = 2
