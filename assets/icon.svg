<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22c7bd"/>
      <stop offset="1" stop-color="#5ff0e3"/>
    </linearGradient>
    <radialGradient id="fog" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6c76a" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#e8a640" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e8a640" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="50" y="50" width="156" height="156" rx="22"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- minimap: frame, lanes and river (stylised, not the game's map) -->
  <g clip-path="url(#frame)">
    <rect x="50" y="50" width="156" height="156" fill="#0f1a20"/>
    <path d="M50 206 L206 50" stroke="#1f3a44" stroke-width="22"/>
    <path d="M72 206 V72 H206" fill="none" stroke="url(#map)" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 184 H184 V50" fill="none" stroke="url(#map)" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 186 L186 70" stroke="url(#map)" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="50" y="50" width="156" height="156" rx="22" fill="none" stroke="url(#map)" stroke-width="9"/>

  <!-- fog prediction: soft area, dashed ring, ghost -->
  <circle cx="160" cy="98" r="54" fill="url(#fog)"/>
  <circle cx="160" cy="98" r="36" fill="none" stroke="#f2b85a" stroke-width="5" stroke-dasharray="11 7" stroke-linecap="round"/>
  <circle cx="160" cy="98" r="22" fill="url(#glow)"/>
  <circle cx="160" cy="98" r="10" fill="#ffd27a"/>
  <circle cx="160" cy="98" r="10" fill="none" stroke="#fff3d6" stroke-width="2.5"/>

  <!-- ally with a short motion trail -->
  <circle cx="74" cy="182" r="5" fill="#3fe0d2" fill-opacity=".25"/>
  <circle cx="86" cy="170" r="7" fill="#3fe0d2" fill-opacity=".45"/>
  <circle cx="101" cy="155" r="13" fill="#3fe0d2"/>
  <circle cx="101" cy="155" r="13" fill="none" stroke="#e8fffc" stroke-width="2.5"/>
</svg>
